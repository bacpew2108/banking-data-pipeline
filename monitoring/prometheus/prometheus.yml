global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  # 1. Prometheus Server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. cAdvisor (CPU, RAM, Disk của các Docker Containers) - service 'cadvisor' trong docker-compose
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Kafka Exporter (Partition Offset & Throughput của topic)
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # 4. Spark Master: số worker / application đang chạy.
  # PrometheusServlet được bật qua SPARK_MASTER_OPTS (docker-compose); đường dẫn cũ
  # /metrics/prometheus chỉ trả về trang HTML của Spark UI nên target luôn DOWN.
  - job_name: 'spark'
    metrics_path: '/metrics/master/prometheus/'
    static_configs:
      - targets: ['spark-master:8080']

  # 5. Pushgateway: metrics do các job đẩy lên
  #    - spark_bronze_streaming / spark_silver_streaming: throughput, Kafka lag, heartbeat, DLQ
  #    - great_expectations: kết quả Quality Gate, số bản ghi Silver / DLQ
  #    - airflow_dag: trạng thái lần chạy gần nhất của từng DAG
  #    - ingestion: số bản ghi đã insert / bị từ chối
  # honor_labels giữ nguyên nhãn job/query/dag_id do client gắn.
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
