global:
  resolve_timeout: 5m

# Hiện chưa gửi cảnh báo ra ngoài: mọi cảnh báo vào receiver 'ui-only' và chỉ xem
# trên Alertmanager UI (http://localhost:9093) hoặc Grafana.
# Để bật gửi, thêm cấu hình vào receiver tương ứng (xem mẫu bên dưới), đặt
# token / URL / mật khẩu vào file trong monitoring/alertmanager/secrets/ (đã gitignore),
# mount thư mục đó vào container rồi chạy: docker compose restart alertmanager
route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'ui-only'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'ui-only'

receivers:
  - name: 'ui-only'

